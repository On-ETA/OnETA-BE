name: Validate FIRST Kakao candidates

on:
  push:
    branches:
      - VALIDATE/FIRST-KAKAO-CANDIDATES

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Kakao route candidates
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          params = {
              "start_x": "127.074979",
              "start_y": "37.2003667",
              "end_x": "126.9218474",
              "end_y": "37.5591671",
          }
          url = "https://dapi.kakao.com/v2/routing/publictraffic?" + urllib.parse.urlencode(params)
          req = urllib.request.Request(url, headers={"Authorization": "KakaoAK " + os.environ["KAKAO_REST_API_KEY"]})
          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.load(response)
          routes = data.get("routes") or []
          print("status=", data.get("status"), "route_count=", len(routes), "properties_total=", (data.get("properties") or {}).get("total"))
          for i, route in enumerate(routes[:15]):
              steps = route.get("steps") or []
              vehicles=[]
              for step in steps:
                  p=step.get("properties") or {}
                  if p.get("type") in ("BUS","SUBWAY"):
                      vs=p.get("vehicles") or []
                      vehicles.append((p.get("type"), [v.get("name") for v in vs[:2]], p.get("time")))
              print(i, vehicles)
          PY
