name: Midnight transit regression
on:
  pull_request:
    branches: [main]
jobs:
  midnight-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - name: Run midnight departure regression tests
        run: |
          ./gradlew test \
            --tests 'com.OnETA.service.OdsayConnectedLastSubwayTest' \
            --tests 'com.OnETA.service.TransitScheduleServiceTest.lastSubwayTransferUsesConnectedOdsayJourneyInsteadOfTwoIndependentLastTrains' \
            --tests 'com.OnETA.service.KoreanSubwayServiceDayTest' \
            --tests 'com.OnETA.service.TransitScheduleCalculatorTest' \
            --tests 'com.OnETA.service.TagoSubwayScheduleServiceTest' \
            --tests 'com.OnETA.service.SeoulMetroTrainScheduleServiceTest' \
            --tests 'com.OnETA.service.TransitScheduleServiceTest.hangulDayOdsayScheduleRequestUsesHolidayDayAndCorrectAccessWalk' \
            --tests 'com.OnETA.service.TransitScheduleServiceTest.mapsOdsaySubwayDayFromServiceDate' \
            --tests 'com.OnETA.service.SeoulBusScheduleServiceTest' \
            --tests 'com.OnETA.service.TransitApiServiceTest' \
            --tests 'com.OnETA.service.TransitRouteOptimizationServiceTest' \
            --tests 'com.OnETA.service.TransitScheduleServiceTest.selectedJustAfterMidnightRemainsOnPreviousOperatingDayEvenWithLaterSnapshot' \
            --tests 'com.OnETA.service.TransitScheduleServiceTest.todayPinnedLastWinsOverTomorrowSnapshotWhileItIsCatchable' \
            --tests 'com.OnETA.service.TransitScheduleServiceTest.kakaoSubwayOnlyLastPrefersVerifiedMetroTrainTimesOverAmbiguousTago' \
            --tests 'com.OnETA.service.TransitScheduleServiceTest.selectedPastLastDepartureIsRejectedBeforeCreatingSnapshot' \
            --tests 'com.OnETA.service.TransitScheduleServiceTest.pinnedLastKeepsLiveSeoulBusEvaluationWhenBindingIsAvailable' \
            --tests 'com.OnETA.scheduler.FirstLastNotificationSchedulerTest.midnightDoesNotEvaluateTonightWhileSelectedPreviousLastIsFuture' \
            --tests 'com.OnETA.service.NotificationServiceTest.transitCreatePinsDepartureCarriedInExistingRouteDetails' \
            --tests 'com.OnETA.service.NotificationServiceTest.routeResetPinsTheNewDepartureWithoutAnyFrontendRequestField' \
            --tests 'com.OnETA.service.TransitRouteOptimizationServiceTest.lastAt2359OnlyReturnsTheStillCatchableOvernightTrip' \
            --tests 'com.OnETA.service.TransitRouteOptimizationServiceTest.lastAt0001DoesNotJumpToTonightWhenCurrentLastUnavailable'
