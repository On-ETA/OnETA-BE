name: APM lab isolated smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'perf/**'
      - 'src/main/resources/application-apm.yml'
      - 'src/main/java/com/OnETA/config/ApmLabMonitoringSecurityConfiguration.java'
      - 'build.gradle'
      - 'src/main/java/com/OnETA/config/ApmLabSafetyConfiguration.java'
      - 'src/main/java/com/OnETA/config/SchedulingConfiguration.java'
      - 'src/main/java/com/OnETA/OnETAApplication.java'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate local-only ephemeral lab secrets
        shell: bash
        run: |
          set -eu
          {
            echo "LAB_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "LAB_DB_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "LAB_JWT_SECRET=$(openssl rand -hex 32)"
            echo "LAB_GRAFANA_PASSWORD=$(openssl rand -hex 32)"
          } > perf/.env.apm

      - name: Check Compose configuration
        run: docker compose --env-file perf/.env.apm -f perf/compose.yaml config --quiet

      - name: Start isolated MySQL, Redis and OnETA
        run: docker compose --env-file perf/.env.apm -f perf/compose.yaml up --build -d

      - name: Verify startup, HTTP listener and Flyway
        shell: bash
        run: |
          set -euo pipefail
          started=0
          for i in $(seq 1 60); do
            if docker compose --env-file perf/.env.apm -f perf/compose.yaml logs app 2>&1 | grep -q "Started OnETAApplication"; then
              started=1
              break
            fi
            sleep 3
          done
          test "$started" -eq 1
          app_id=$(docker compose --env-file perf/.env.apm -f perf/compose.yaml ps -q app)
          test "$(docker inspect "$app_id" --format '{{len .NetworkSettings.Networks}}')" -eq 1
          test "$(docker network inspect oneta-apm-lab_lab_internal --format '{{.Internal}}')" = true
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/bus-routes/search?keyword=test)
          test "$code" != 000
          # Host gateway must never expose management metrics.
          mcode=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/actuator/prometheus)
          test "$mcode" = 404
          # Prometheus discovers Actuator only on the Docker private network.
          up=0
          for i in $(seq 1 30); do
            if docker compose --env-file perf/.env.apm -f perf/compose.yaml exec -T prometheus wget -qO- 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22oneta-apm%22%7D' | grep -q '"value":\[[^]]*,"1"\]'; then
              up=1
              break
            fi
            sleep 3
          done
          test "$up" -eq 1
          # Grafana is locally reachable without exposing its administrative API to the internet.
          gcode=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:13000/api/health)
          test "$gcode" = 200
          docker compose --env-file perf/.env.apm -f perf/compose.yaml exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u "$MYSQL_USER" "$MYSQL_DATABASE" -e "SELECT version, success FROM flyway_schema_history ORDER BY installed_rank DESC LIMIT 3;"'

      - name: Print safe diagnostics if startup fails
        if: failure()
        run: docker compose --env-file perf/.env.apm -f perf/compose.yaml logs --tail=100 app mysql prometheus grafana

      - name: Remove ephemeral resources
        if: always()
        run: |
          docker compose --env-file perf/.env.apm -f perf/compose.yaml down --volumes --remove-orphans || true
          rm -f perf/.env.apm
