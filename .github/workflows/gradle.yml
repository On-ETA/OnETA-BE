name: Java CI with Gradle

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build -x test

      - name: Copy JAR to EC2
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/${{ secrets.EC2_USER }}/app"
          strip_components: 2

      - name: Restart application
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_EXPIRATION: ${{ secrets.JWT_ACCESS_EXPIRATION }}
          JWT_REFRESH_EXPIRATION: ${{ secrets.JWT_REFRESH_EXPIRATION }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          ODSAY_API_KEY: ${{ secrets.ODSAY_API_KEY }}
          PUBLICDATA_API_KEY: ${{ secrets.PUBLICDATA_API_KEY }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          envs: DB_URL,DB_USERNAME,DB_PASSWORD,REDIS_HOST,REDIS_PORT,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,MAIL_HOST,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,JWT_SECRET,JWT_ACCESS_EXPIRATION,JWT_REFRESH_EXPIRATION,SERVER_URL,ODSAY_API_KEY,PUBLICDATA_API_KEY

          script: |
            set -e

            cd ~/app

            echo "=== Environment check ==="

            echo "DB_URL exists: $([ -n "$DB_URL" ] && echo YES || echo NO)"
            echo "DB_USERNAME exists: $([ -n "$DB_USERNAME" ] && echo YES || echo NO)"
            echo "DB_PASSWORD exists: $([ -n "$DB_PASSWORD" ] && echo YES || echo NO)"

            if [[ "$DB_URL" == *"oneta-db.cdoywqeoebv0.ap-northeast-2.rds.amazonaws.com"* ]]; then
              echo "DB_URL target: EXPECTED_RDS"
            else
              echo "DB_URL target: UNEXPECTED"
              exit 1
            fi

            echo "=== Stopping existing application ==="

            PID=$(sudo lsof -t -iTCP:8080 -sTCP:LISTEN 2>/dev/null | head -n 1 || true)

            if [ -n "$PID" ]; then
              echo "Stopping application on port 8080: $PID"
              kill "$PID"

              for i in {1..10}; do
                if ! kill -0 "$PID" 2>/dev/null; then
                  echo "Existing application stopped"
                  break
                fi

                sleep 1
              done

              if kill -0 "$PID" 2>/dev/null; then
                echo "Existing application did not stop gracefully"
                kill -9 "$PID"
                sleep 1
              fi
            else
              echo "No application listening on port 8080"
            fi

            echo "=== Starting application ==="

            nohup java \
              -Dspring.profiles.active=prod \
              -jar HomeRun-0.0.1-SNAPSHOT.jar \
              > app.log 2>&1 < /dev/null &

            NEW_PID=$!

            echo "Started application PID: $NEW_PID"
            echo "Waiting for Spring Boot startup..."

            STARTED=false

            # 최대 60초 동안 2초 간격으로 애플리케이션 기동 확인
            for i in {1..30}; do

              # 기동 중 프로세스가 종료되면 즉시 실패
              if ! kill -0 "$NEW_PID" 2>/dev/null; then
                echo "Application process terminated during startup"
                echo "=== Application log ==="
                tail -n 150 app.log
                exit 1
              fi

              # 8080 포트가 열렸으면 기동 성공
              if ss -lnt | grep -q ':8080 '; then
                echo "Application is listening on port 8080"
                STARTED=true
                break
              fi

              echo "Application is still starting... ($((i * 2))/60s)"
              sleep 2
            done

            # 60초가 지나도 8080이 열리지 않은 경우
            if [ "$STARTED" != "true" ]; then
              echo "Application process is running but port 8080 is not listening after 60 seconds"
              echo "=== Application log ==="
              tail -n 150 app.log
              exit 1
            fi

            echo "=== Deployment completed successfully ==="
