spring:
  config:
    activate:
      on-profile: local
    import: optional:classpath:.env.local[.properties]

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  # H2 Database (Local Development)
  datasource:
    url: jdbc:h2:mem:homerun;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Swagger Configuration
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
  show-actuator: false
  server-url: http://localhost:8081
  server-description: Local Server

app:
  scheduler:
    notification:
      enabled: true

server:
  port: 8081

odsay:
  api:
    key: ${ODSAY_API_KEY:}
    url: ${ODSAY_API_URL:https://api.odsay.com/v1/api/searchPubTransPathR}
    referer: ${ODSAY_API_REFERER:http://localhost:8080/}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:local-development-secret-key-must-be-at-least-32-characters-long}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}
  
