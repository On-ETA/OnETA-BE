name: oneta-apm-lab

services:
  mysql:
    image: mysql:8.0.44
    environment:
      MYSQL_DATABASE: oneta_apm
      MYSQL_USER: oneta_lab
      MYSQL_PASSWORD: ${LAB_DB_PASSWORD:?run-perf-prepare-script}
      MYSQL_ROOT_PASSWORD: ${LAB_DB_ROOT_PASSWORD:?run-perf-prepare-script}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lab_internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    networks:
      - lab_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: perf/Dockerfile.apm
    environment:
      SPRING_PROFILES_ACTIVE: apm
      LAB_DB_PASSWORD: ${LAB_DB_PASSWORD:?run-perf-prepare-script}
      LAB_JWT_SECRET: ${LAB_JWT_SECRET:?run-perf-prepare-script}
      APP_FIREBASE_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Management port 9091 is only reachable on the internal Docker network.
    expose:
      - "9091"
    networks:
      - lab_internal

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./nginx.lab.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lab_internal
      - lab_access

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - lab_internal
    depends_on:
      - app

  grafana:
    image: grafana/grafana:12.2.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${LAB_GRAFANA_PASSWORD:?run-perf-prepare-script}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - lab_internal
      - lab_access
    depends_on:
      - prometheus

networks:
  lab_internal:
    internal: true
  lab_access:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
