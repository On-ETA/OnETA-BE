# Only a local HTTP ingress. Never attach the application to a public bridge.
server {
    listen 8080;
    server_name localhost;
    access_log off;

    # Never expose Spring Boot Actuator on the public/local API listener.
    location ^~ /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
